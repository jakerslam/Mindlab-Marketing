name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  CONTENT_SOURCE: sanity
  SITE_STAGE: preview

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.pages.outputs.base_url }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build and verify published CMS content
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build
          npm run verify
      - name: Upload static build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-static
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: write
      actions: read
    environment:
      name: github-pages
      url: ${{ needs.build.outputs.page_url }}
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/pages-static
          path: published
          persist-credentials: false
      - name: Download static build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-static
          path: dist
      - name: Publish branch and verify Pages build
        working-directory: published
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_EXPECTED_URL: ${{ needs.build.outputs.page_url }}
        run: |
          pages_configuration="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          pages_current_url="$(jq -r '.html_url' <<< "$pages_configuration")"
          if [[ "${pages_current_url%/}" != "${PAGES_EXPECTED_URL%/}" ]]; then
            echo 'Pages domain changed during the build. Run the workflow again.' >&2
            exit 1
          fi
          rsync --archive --delete --exclude=.git ../dist/ ./
          touch .nojekyll
          pages_cname="$(jq -r '.cname // empty' <<< "$pages_configuration")"
          if [[ -n "$pages_cname" ]]; then
            printf '%s\n' "$pages_cname" > CNAME
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish static site from ${GITHUB_SHA}"
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/codex/pages-static
          fi
          pages_commit="$(git rev-parse HEAD)"
          pages_build_url="repos/${GITHUB_REPOSITORY}/pages/builds/latest"
          pages_existing_build="$(gh api "$pages_build_url")"
          if [[ "$(jq -r '.commit' <<< "$pages_existing_build")" == "$pages_commit" && "$(jq -r '.status' <<< "$pages_existing_build")" == 'built' ]]; then
            echo "GitHub Pages already published ${pages_commit}."
            exit 0
          fi
          if [[ "$(jq -r '.commit' <<< "$pages_existing_build")" == "$pages_commit" && "$(jq -r '.status' <<< "$pages_existing_build")" == 'building' ]]; then
            echo "GitHub Pages is already building ${pages_commit}."
          else
            if ! pages_response="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds")"; then
              if [[ "$(jq -r '.status // empty' <<< "$pages_response")" != '409' ]]; then
                echo 'GitHub rejected the Pages build request.' >&2
                exit 1
              fi
            fi
          fi
          # GitHub may return its numeric repository URL. Use our known endpoint.
          for pages_attempt in {1..48}; do
            pages_build="$(gh api "$pages_build_url")"
            pages_status="$(jq -r '.status' <<< "$pages_build")"
            pages_built_commit="$(jq -r '.commit' <<< "$pages_build")"
            if [[ "$pages_built_commit" != "$pages_commit" ]]; then
              sleep 10
              continue
            fi
            case "$pages_status" in
              built)
                echo "GitHub Pages published ${pages_commit}."
                exit 0
                ;;
              errored)
                gh api "$pages_build_url" --jq '.error.message'
                # GitHub may cancel a build in favor of a newer one for this commit.
                # Continue the bounded poll while the latest build catches up.
                ;;
            esac
            sleep 10
          done
          echo 'GitHub Pages did not complete publication within eight minutes.' >&2
          exit 1
